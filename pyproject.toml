[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "pygut"
description = "pygame utility package so I don't have to rewrite all my code every project."
authors = [
  { name="Myles Godfrey", email="mylesgodfrey17@gmail.com" },
]
version = "4.0.0"
requires-python = ">=3.9"
dependencies = [
    "pygame"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Home = "https://github.com/Mylesian/pygame_util"